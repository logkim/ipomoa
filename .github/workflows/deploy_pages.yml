name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main, master ]
  schedule:
    # 매일 한국 시간 오전 8:30 (UTC 23:30)에 최신 공모주 정보 업데이트 & 자동 재배포
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart & Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch latest IPO data (38.co.kr)
        run: dart run tool/fetch_ipo_json.dart

      - name: Build Flutter Web
        run: flutter build web --base-href "/ipomoa/" --release

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 또한 gh-pages 브랜치 백업 배포도 병행 (선택적)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
